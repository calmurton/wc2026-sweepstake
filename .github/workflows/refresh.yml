name: Update World Cup scores

# Runs every 20 minutes during the tournament window (UTC).
# World Cup 2026 runs 11 Jun – 19 Jul. Outside that window the workflow is dormant.
#
# Manual trigger ("Run workflow" button) always works regardless of date.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check tournament window
        id: window
        run: |
          NOW=$(date -u +%s)
          START=$(date -u -d '2026-06-11 00:00:00' +%s)
          END=$(date -u -d '2026-07-20 04:00:00' +%s)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Manual trigger — running."
          elif [ "$NOW" -ge "$START" ] && [ "$NOW" -le "$END" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Within tournament window — running."
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Outside tournament window — skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.skip == 'false'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.skip == 'false'
        with:
          python-version: '3.11'

      - name: Fetch scores from football-data.org
        if: steps.window.outputs.skip == 'false'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/fetch_scores.py

      - name: Commit and push if changed
        if: steps.window.outputs.skip == 'false'
        run: |
          git config user.name "World Cup Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scores.json data/top-scorers.json data/last-updated.json
          if git
